<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Admission Quote Component</title>
  <style>
    :root {
      --med-primary: #0d5c75;
      --med-primary-dark: #083b4b;
      --med-accent: #2a9d8f;
      --med-surface: #f0f7f9;
      --med-border: #d2e4ea;
      --med-text-main: #1a2a32;
      --med-text-muted: #4a636e;
      --med-shadow: 0 4px 16px -2px rgba(13, 92, 117, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
    }

    .admission-quote-card {
      position: relative;
      max-width: 780px;
      margin: 1.5rem auto;
      padding: 1.75rem 2rem;
      background: #ffffff;
      border: 1px solid var(--med-border);
      border-left: 6px solid var(--med-primary);
      border-radius: 6px;
      box-shadow: var(--med-shadow);
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.5rem;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--med-text-main);
    }

    /* Decorative Medical Cross / Caduceus Motif */
    .admission-quote-card .icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background-color: var(--med-surface);
      border: 1px solid var(--med-border);
      border-radius: 50%;
      color: var(--med-primary);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .admission-quote-card .icon-wrapper svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .admission-quote-card .content-area {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .admission-quote-card blockquote {
      margin: 0;
      padding: 0;
    }

    .admission-quote-card blockquote p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      font-style: italic;
      color: var(--med-text-main);
      letter-spacing: -0.01em;
    }

    .admission-quote-card figcaption {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-top: 1px solid var(--med-border);
      padding-top: 0.65rem;
      font-size: 0.8125rem;
    }

    .admission-quote-card .author {
      font-weight: 600;
      color: var(--med-primary-dark);
      letter-spacing: 0.01em;
    }

    .admission-quote-card .trust-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
      color: var(--med-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.725rem;
    }

    .admission-quote-card .trust-badge::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--med-accent);
    }

    /* Print Stylesheet Overrides for Hospital Records */
    @media print {
      .admission-quote-card {
        border: 1px solid #999;
        border-left: 4px solid #333;
        box-shadow: none;
        background: transparent;
        padding: 1rem;
        page-break-inside: avoid;
      }

      .admission-quote-card .icon-wrapper {
        border-color: #666;
        color: #333;
      }
    }

    @media (max-width: 520px) {
      .admission-quote-card {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1.25rem;
      }
      .admission-quote-card .icon-wrapper {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Reusable Clinical Admission Quote Component -->
  <figure class="admission-quote-card" role="region" aria-label="Patient Welcome Quote">
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
      </svg>
    </div>

    <div class="content-area">
      <blockquote>
        <p>“Healing is an art that requires not only medical science, but devotion, patience, and time. From this threshold onward, your recovery is our singular purpose.”</p>
      </blockquote>

      <figcaption>
        <span class="author">— Clinical Care &amp; Inpatient Services</span>
        <span class="trust-badge">Accredited Quality Care</span>
      </figcaption>
    </div>
  </figure>

</body>
</html>
